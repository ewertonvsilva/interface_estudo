<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Plataforma de Estudos</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Tela de Login/Nome */
        .box-login {
            text-align: center;
            padding: 20px;
        }

        .input-nome {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-nome:focus {
            border-color: #2196F3;
            outline: none;
        }

        .topo-fixo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .placar {
            font-size: 20px;
            color: #2196F3;
            font-weight: bold;
            background: #e3f2fd;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            transition: 0.2s;
            background: #eef2f3;
            border: 1px solid #dcdfe6;
        }

        .btn:hover:not(:disabled) {
            background: #e0e6ed;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-voltar {
            background: transparent;
            color: #666;
            width: auto;
            border: none;
        }

        .btn-login {
            background: #4CAF50;
            color: white;
            text-align: center;
        }

        .btn-login:hover {
            background: #45a049;
        }

        .img-enunciado {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
            border: 1px solid #eef2f3;
        }

        .box {
            padding: 18px;
            margin: 20px 0;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
            font-size: 15px;
        }

        .box-dica {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }

        .box-resolucao {
            background: #f4f7f6;
        }

        .sucesso-border {
            border-left: 5px solid #4CAF50;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .erro-border {
            border-left: 5px solid #f44336;
            background: #ffebee;
            color: #b71c1c;
        }

        .btn-avancar {
            background: #2196F3;
            color: white;
            text-align: center;
            margin-top: 15px;
            width: 100%;
        }

        .lista-testes {
            list-style: none;
            padding: 0;
        }

        .card-teste {
            display: block;
            padding: 18px;
            background: #eef2f3;
            margin: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: 0.2s;
        }

        .card-teste:hover {
            background: #2196F3;
            color: white;
            transform: translateX(5px);
        }

        /* Rodapé Fixo para o link do Dontpad */
        .rodape-link {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: #fff;
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
        }

        .rodape-link a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: bold;
        }

        .rodape-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div id="container-login" style="display:none;" class="container">
        <div class="box-login">
            <h2>👋 Boas-vindas ao Simulado!</h2>
            <p>Por favor, digite seu nome completo para carregar seu progresso:</p>
            <input type="text" id="input-aluno-nome" class="input-nome" placeholder="Ex: Ewerton"
                onkeypress="if(event.key === 'Enter') entrarNaPlataforma()">
            <button class="btn btn-login" onclick="entrarNaPlataforma()">Entrar no Simulado</button>
        </div>
    </div>

    <div id="container-home" style="display:none;" class="container"></div>

    <div id="container-jogo" style="display:none; max-width:650px; margin: 0 auto;">
        <div class="topo-fixo">
            <button class="btn btn-voltar" onclick="voltarParaHome()">⬅️ Menu</button>
            <div id="contador-passos" style="font-size: 15px; color: #606266; font-weight: bold;"></div>
            <div class="placar">Pontos: <span id="placar">0</span> ⭐</div>
        </div>

        <div class="container">
            <div id="jogo-area"></div>
        </div>
    </div>

    <div class="rodape-link">
        📂 Central do Professor: <a id="link-indice-externo" href="#" target="_blank">Ver formulário de respostas e progresso</a>
    </div>

    <script src="script.js"></script>
</body>

</html>
