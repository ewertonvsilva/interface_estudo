<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: sans-serif;
            background: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 12px;
            padding-bottom: 12px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto 16px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Tela de Login */
        .box-login {
            text-align: center;
            padding: 10px 0;
        }

        .box-login h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .box-login p {
            font-size: 15px;
            color: #555;
        }

        .input-nome {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            /* 16px evita zoom automático no iOS */
        }

        .input-nome:focus {
            border-color: #2196F3;
            outline: none;
        }

        /* Topo fixo do jogo */
        .topo-fixo {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .placar {
            font-size: 16px;
            color: #2196F3;
            font-weight: bold;
            background: #e3f2fd;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        #contador-passos {
            font-size: 13px;
            color: #606266;
            font-weight: bold;
            text-align: center;
            flex: 1;
            padding: 0 8px;
        }

        /* Botões */
        .btn {
            padding: 14px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            text-align: left;
            margin: 6px 0;
            transition: background 0.15s, transform 0.1s;
            background: #eef2f3;
            border: 1px solid #dcdfe6;
            line-height: 1.4;
            /* Mínimo de 48px para área de toque */
            min-height: 48px;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:hover:not(:disabled) {
            background: #e0e6ed;
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-voltar {
            background: transparent;
            color: #666;
            width: auto;
            border: none;
            min-width: 44px;
            padding: 8px 10px;
            font-size: 18px;
        }

        .btn-login {
            background: #4CAF50;
            color: white;
            text-align: center;
        }

        .btn-login:active {
            background: #45a049;
        }

        .img-enunciado {
            max-width: 100%;
            border-radius: 8px;
            margin: 12px 0;
            display: block;
            border: 1px solid #eef2f3;
        }

        /* Caixas de dica/resolução */
        .box {
            padding: 14px 16px;
            margin: 14px 0;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
            font-size: 14px;
        }

        .box-dica {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }

        .box-resolucao {
            background: #f4f7f6;
        }

        .sucesso-border {
            border-left: 5px solid #4CAF50;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .erro-border {
            border-left: 5px solid #f44336;
            background: #ffebee;
            color: #b71c1c;
        }

        .btn-avancar {
            background: #2196F3;
            color: white;
            text-align: center;
            margin-top: 12px;
            width: 100%;
            font-size: 16px;
            padding: 16px;
        }

        /* Menu de testes */
        .lista-testes {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .card-teste {
            display: block;
            padding: 16px;
            background: #eef2f3;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.15s;
            min-height: 52px;
            display: flex;
            align-items: center;
        }

        .card-teste:active {
            background: #2196F3;
            color: white;
        }

        /* Vídeo responsivo */
        #yt-player,
        #yt-player iframe {
            width: 100% !important;
            border-radius: 6px;
        }

        /* Tablet/Desktop */
        @media (min-width: 600px) {
            body {
                padding: 20px;
                padding-bottom: 20px;
            }

            .container {
                padding: 30px;
            }

            .btn {
                font-size: 16px;
            }

            .card-teste:hover {
                background: #2196F3;
                color: white;
                transform: translateX(5px);
            }

            .topo-fixo {
                padding: 15px 25px;
            }

            .placar {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="container-login" style="display:none;" class="container">
        <div class="box-login">
            <h2>👋 Boas-vindas ao Simulado!</h2>
            <p>Digite seu nome completo para carregar seu progresso:</p>
            <input type="text" id="input-aluno-nome" class="input-nome" placeholder="Ex: Ewerton"
                onkeypress="if(event.key === 'Enter') entrarNaPlataforma()">
            <button class="btn btn-login" onclick="entrarNaPlataforma()">Entrar no Simulado</button>
        </div>
    </div>

    <div id="container-home" style="display:none;" class="container"></div>

    <div id="container-jogo" style="display:none; max-width:650px; margin: 0 auto;">
        <div class="topo-fixo">
            <button class="btn btn-voltar" onclick="voltarParaHome()">⬅️</button>
            <div id="contador-passos"></div>
            <div class="placar">⭐ <span id="placar">0</span></div>
        </div>

        <div class="container">
            <div id="jogo-area"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>

</html>
